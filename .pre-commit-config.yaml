minimum_pre_commit_version: "3.6.0"

exclude: ^core/modes/dictation_mode_sv\.talon$

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        types: [text]
        language: system
        entry: prettier
        args: [--write, --list-different, --ignore-unknown]

  - repo: https://github.com/cursorless-dev/talon-tools
    rev: v0.11.2
    hooks:
      - id: talon-fmt
      - id: snippet-fmt
